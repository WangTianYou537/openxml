[package]
name = "officexml"
version = "0.1.0"
edition = "2021"
description = "Rust Open XML SDK — create and edit Word, Excel, and PowerPoint documents; native SVG→PPTX shapes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WangTianYou537/openxml"
homepage = "https://github.com/WangTianYou537/openxml"
keywords = ["openxml", "docx", "xlsx", "pptx", "office"]
categories = ["encoding", "parser-implementations", "command-line-utilities"]
publish = false

[lib]
name = "officexml"
path = "src/lib.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
thiserror = "2"
indexmap = "2"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
rand = "0.8"
pkcs8 = { version = "0.10", features = ["pem"] }
spki = { version = "0.7", features = ["pem"] }
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "svg2pptx"
path = "src/bin/svg2pptx.rs"

[[bin]]
name = "openxml-codegen"
path = "src/bin/openxml-codegen.rs"
required-features = ["codegen"]

[features]
default = []
# Schema codegen binary (dev / contributors only).
codegen = []

[[example]]
name = "create_word"
path = "examples/create_word.rs"

[[example]]
name = "read_word"
path = "examples/read_word.rs"

[[example]]
name = "create_report"
path = "examples/create_report.rs"

[[example]]
name = "create_spreadsheet"
path = "examples/create_spreadsheet.rs"

[[example]]
name = "create_ppt_with_svg"
path = "examples/create_ppt_with_svg.rs"

[[example]]
name = "create_ppt_from_svg_shapes"
path = "examples/create_ppt_from_svg_shapes.rs"
