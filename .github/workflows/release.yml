name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: svg2pptx-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: svg2pptx-x86_64-pc-windows-msvc
            exe: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: svg2pptx-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: svg2pptx-x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin svg2pptx --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [ "${{ matrix.exe }}" = "true" ]; then EXT=".exe"; fi
          BIN="target/${{ matrix.target }}/release/svg2pptx${EXT}"
          test -f "$BIN"
          STAGE="dist/${{ matrix.asset }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/svg2pptx${EXT}"
          cp README.md LICENSE "$STAGE/"
          mkdir -p release-assets
          if [ "${{ matrix.exe }}" = "true" ]; then
            (cd dist && tar -a -cf "../release-assets/${{ matrix.asset }}.zip" "${{ matrix.asset }}")
          else
            tar -C dist -czf "release-assets/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          fi
          ls -la release-assets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -v {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: officexml ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          body: |
            ## officexml ${{ github.ref_name }}

            Rust Open XML SDK + **`svg2pptx`** CLI (SVG → native PPTX shapes, multi-slide).

            ### CLI binaries

            Download the archive for your platform from **Assets**, extract, and put `svg2pptx` on your `PATH`.

            ```bash
            svg2pptx -o deck.pptx a.svg b.svg c.svg
            svg2pptx --font-shape out.pptx in.svg
            svg2pptx --embed-font out.pptx in.svg
            svg2pptx --embed-font-fully out.pptx in.svg
            ```

            ### Library (git dependency)

            ```toml
            officexml = { git = "https://github.com/WangTianYou537/openxml", tag = "${{ github.ref_name }}" }
            ```

            Not published to crates.io (package size).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
