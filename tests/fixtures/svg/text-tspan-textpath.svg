<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200">
  <title>Text, tspan positioning, inheritance and textPath fallback</title>
  <defs><path id="curve" d="M30 155 Q240 65 450 155"/></defs>
  <text x="24" y="45" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Native SVG text</text>
  <text x="24" y="85" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#334155">
    Parent <tspan fill="#dc2626" font-style="italic">styled</tspan><tspan dx="8" fill="#2563eb">tspan</tspan>
  </text>
  <text font-family="DejaVu Sans, sans-serif" font-size="18" fill="#7c3aed" letter-spacing="1">
    <textPath href="#curve" startOffset="10%">Text on a referenced path</textPath>
  </text>
</svg>
