<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180">
  <title>Linear and radial gradients plus a tiled pattern</title>
  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(8)">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#facc15" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="radial" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </radialGradient>
    <pattern id="checks" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="18" height="18" fill="#dbeafe"/>
      <rect width="9" height="9" fill="#2563eb"/>
      <rect x="9" y="9" width="9" height="9" fill="#2563eb"/>
    </pattern>
  </defs>
  <rect x="10" y="15" width="100" height="150" rx="12" fill="url(#linear)"/>
  <circle cx="180" cy="90" r="72" fill="url(#radial)"/>
  <path d="M265 20 H350 V160 H265 Z" fill="url(#checks)" stroke="#1e3a8a" stroke-width="3"/>
</svg>
