<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 180">
  <title>Same-document use and symbol reuse</title>
  <defs>
    <g id="badge" fill="#38bdf8" stroke="#075985" stroke-width="2">
      <circle cx="20" cy="20" r="18"/>
      <path d="M10 21 L17 28 L31 12" fill="none" stroke="#ffffff" stroke-width="4"/>
    </g>
    <symbol id="star" viewBox="0 0 100 100">
      <polygon points="50,4 61,36 96,36 68,57 79,91 50,70 21,91 32,57 4,36 39,36" fill="#facc15" stroke="#a16207" stroke-width="3"/>
    </symbol>
  </defs>
  <use href="#badge" x="15" y="20"/>
  <use xlink:href="#badge" x="75" y="75" transform="scale(1.2)"/>
  <use href="#star" x="160" y="15" width="140" height="140"/>
</svg>
