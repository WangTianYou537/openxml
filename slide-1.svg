<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
        <radialGradient id="bgGradient" cx="10%" cy="10%" r="100%">
            <stop offset="0%" stop-color="#141923" />
            <stop offset="50%" stop-color="#0B0D13" />
            <stop offset="100%" stop-color="#050608" />
        </radialGradient>

        <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="50%" stop-color="#3B82F6" />
            <stop offset="100%" stop-color="#60A5FA" />
        </linearGradient>

        <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0D9488" />
            <stop offset="100%" stop-color="#14B8A6" />
        </linearGradient>

        <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#A78BFA" />
        </linearGradient>

        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
            <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="40" result="blur" />
        </filter>
    </defs>

    <rect width="1280" height="720" fill="url(#bgGradient)" />

    <path d="M-100,200 Q300,150 700,300 T1380,100" fill="none" stroke="url(#lineGradient)" stroke-width="2" />
    <path d="M-100,500 Q400,600 800,450 T1380,600" fill="none" stroke="url(#lineGradient)" stroke-width="1.5" />

    <circle cx="950" cy="360" r="250" fill="#2563EB" opacity="0.15" filter="url(#softGlow)" />
    <circle cx="1050" cy="250" r="180" fill="#7C3AED" opacity="0.12" filter="url(#softGlow)" />

    <rect x="90" y="105" width="96" height="28" rx="6" fill="#2563EB" opacity="0.2" />
    <rect x="90" y="105" width="96" height="28" rx="6" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.6" />
    <text x="138" y="124" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="2">LLMOps</text>

    <text x="90" y="195" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="1">Dify：让 LLM 应用落地触手可及</text>

    <text x="90" y="250" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#9CA3AF">开源的下一代 AI 工作流平台 (LLMOps)</text>

    <g transform="translate(90, 340)">
        <line x1="0" y1="0" x2="0" y2="60" stroke="url(#primaryGradient)" stroke-width="4" stroke-linecap="round" />
        <text x="24" y="24" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">连接模型与业务场景</text>
        <text x="24" y="52" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="400" fill="#9CA3AF">打通大语言模型向企业级应用转化的最后一公里</text>
    </g>

    <g transform="translate(90, 440)">
        <line x1="0" y1="0" x2="0" y2="60" stroke="url(#cyanGradient)" stroke-width="4" stroke-linecap="round" />
        <text x="24" y="24" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">极速降低 AI 落地门槛</text>
        <text x="24" y="52" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="400" fill="#9CA3AF">可视化工作流与 Agent 编排，让创新触手可及</text>
    </g>

    <g transform="translate(90, 540)">
        <line x1="0" y1="0" x2="0" y2="60" stroke="url(#purpleGradient)" stroke-width="4" stroke-linecap="round" />
        <text x="24" y="24" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">顺应 AI 时代大势</text>
        <text x="24" y="52" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="400" fill="#9CA3AF">把握从基础模型层向应用层与智能体（Agents）上演进的黄金周期</text>
    </g>


    <g transform="translate(920, 360)">
        <path d="M -160,50 L 0,-120 L 160,50 Z" fill="none" stroke="#1E293B" stroke-width="3" />
        <path d="M -160,50 L 0,140 L 160,50" fill="none" stroke="#1E293B" stroke-width="3" />
        <path d="M 0,-120 L 0,140" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />

        <path d="M -160,50 Q -60,-60 0,-120" fill="none" stroke="url(#cyanGradient)" stroke-width="3" filter="url(#glow)" />
        <path d="M 0,-120 Q 80,-20 160,50" fill="none" stroke="url(#purpleGradient)" stroke-width="3" filter="url(#glow)" />
        <path d="M -160,50 Q 0,80 160,50" fill="none" stroke="url(#primaryGradient)" stroke-width="2" stroke-dasharray="6,4" />

        <g transform="translate(-160, 50)">
            <rect x="-45" y="-45" width="90" height="90" rx="16" fill="url(#cardGrad)" stroke="#0D9488" stroke-width="1.5" />
            <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="#0D9488" opacity="0.2" />
            <polygon points="0,-25 22,-12 0,0" fill="none" stroke="#14B8A6" stroke-width="1" />
            <polygon points="-22,-12 0,0 -22,12" fill="none" stroke="#14B8A6" stroke-width="1" />
            <line x1="0" y1="0" x2="0" y2="25" stroke="#14B8A6" stroke-width="1" />
            <circle cx="0" cy="0" r="6" fill="#14B8A6" filter="url(#glow)" />
            <text x="0" y="65" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#A1A1AA" text-anchor="middle">LLM 模型层</text>
        </g>

        <g transform="translate(0, -120)">
            <circle cx="0" cy="0" r="55" fill="#0B0D13" stroke="#3B82F6" stroke-width="2" filter="url(#glow)" />
            <circle cx="0" cy="0" r="45" fill="url(#primaryGradient)" opacity="0.1" />
            <rect x="-16" y="-16" width="12" height="12" rx="3" fill="none" stroke="#60A5FA" stroke-width="2" />
            <rect x="4" y="-16" width="12" height="12" rx="3" fill="none" stroke="#60A5FA" stroke-width="2" />
            <rect x="-6" y="4" width="12" height="12" rx="3" fill="none" stroke="#60A5FA" stroke-width="2" />
            <path d="M -10,-4 L -10,0 L -2,0 M 10,-4 L 10,0 L 2,0" fill="none" stroke="#3B82F6" stroke-width="1.5" />
            <circle cx="0" cy="-10" r="3" fill="#60A5FA" />
            <circle cx="-10" cy="-10" r="2" fill="#FFFFFF" />
            <circle cx="10" cy="-10" r="2" fill="#FFFFFF" />
            <circle cx="0" cy="10" r="2" fill="#FFFFFF" />
            <text x="0" y="-70" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">Dify Platform</text>
        </g>

        <g transform="translate(160, 50)">
            <rect x="-45" y="-45" width="90" height="90" rx="16" fill="url(#cardGrad)" stroke="#7C3AED" stroke-width="1.5" />
            <circle cx="-12" cy="-12" r="6" fill="#A78BFA" opacity="0.8" />
            <circle cx="12" cy="-12" r="6" fill="#A78BFA" opacity="0.4" />
            <circle cx="-12" cy="12" r="6" fill="#A78BFA" opacity="0.4" />
            <rect x="6" y="6" width="12" height="12" rx="2" fill="#A78BFA" />
            <text x="0" y="65" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#A1A1AA" text-anchor="middle">企业级应用 / Agents</text>
        </g>

        <g transform="translate(0, 140)">
            <ellipse cx="0" cy="0" rx="40" ry="15" fill="url(#cardGrad)" stroke="#64748B" stroke-width="1" stroke-dasharray="4,2" />
            <text x="0" y="5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">商业化落地</text>
        </g>

        <circle cx="-80" cy="-35" r="4" fill="#60A5FA" filter="url(#glow)" />
        <circle cx="80" cy="-35" r="4" fill="#A78BFA" filter="url(#glow)" />
        <circle cx="0" cy="65" r="3" fill="#3B82F6" />
    </g>

    <text x="90" y="685" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="400" fill="#4B5563">Dify 产品介绍系列 | 投资人路演专页</text>
    <line x1="90" y1="665" x2="1190" y2="665" stroke="#1E293B" stroke-width="1" />
</svg>
