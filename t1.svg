<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Technical Background Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F0F0F0" stroke-width="1"/>
    </pattern>

    <!-- Crosshair Marker for Blueprint Aesthetics -->
    <g id="crosshair">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#111111" stroke-width="1"/>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#111111" stroke-width="1"/>
      <circle cx="0" cy="0" r="2" fill="none" stroke="#111111" stroke-width="0.75"/>
    </g>

    <!-- Memristor Crossbar Junction Element -->
    <g id="memristor-node">
      <rect x="-7" y="-7" width="14" height="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
      <line x1="-4" y1="-4" x2="4" y2="4" stroke="#111111" stroke-width="1"/>
      <line x1="-4" y1="4" x2="4" y2="-4" stroke="#111111" stroke-width="1"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect width="1280" height="720" fill="url(#tech-grid)"/>

  <!-- Outer Structural Border -->
  <rect x="30" y="30" width="1220" height="660" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="36" y="36" width="1208" height="648" fill="none" stroke="#111111" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Corner Technical Markers -->
  <use href="#crosshair" x="30" y="30"/>
  <use href="#crosshair" x="1250" y="30"/>
  <use href="#crosshair" x="30" y="690"/>
  <use href="#crosshair" x="1250" y="690"/>

  <!-- Top Academic Header Bar -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="230" height="26" fill="#111111"/>
    <text x="12" y="17" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">NATURE REVIEWS 2025</text>
    <text x="245" y="17" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#666666" letter-spacing="1">GROUP MEETING PRESENTATION · 组会汇报</text>
  </g>

  <!-- LEFT COLUMN: Content & Typography -->
  <!-- Main Title Block -->
  <g transform="translate(70, 150)">
    <text x="0" y="40" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="#111111" letter-spacing="-0.5">The Growing Memristor</text>
    <text x="0" y="90" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="#111111" letter-spacing="-0.5">Industry</text>
    
    <!-- Subtitle with Line Decorator -->
    <line x1="0" y1="120" x2="60" y2="120" stroke="#111111" stroke-width="3"/>
    <text x="75" y="126" font-family="'Georgia', serif" font-size="24" font-style="italic" fill="#444444" letter-spacing="0.5">From Lab to Fab</text>
    
    <text x="0" y="160" font-family="'PingFang SC', 'Helvetica Neue', sans-serif" font-size="16" font-weight="500" fill="#666666" letter-spacing="0.5">忆阻器产业化进程与未来展望</text>
  </g>

  <!-- Divider Line -->
  <line x1="70" y1="360" x2="590" y2="360" stroke="#111111" stroke-width="1"/>
  <line x1="70" y1="364" x2="590" y2="364" stroke="#111111" stroke-width="0.5" stroke-dasharray="2 2"/>

  <!-- Key Points (Structured Academic Metadata Cards) -->
  <g transform="translate(70, 395)">
    <!-- Point 1 -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="12" fill="none" stroke="#111111" stroke-width="1.5"/>
      <text x="12" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">01</text>
      <text x="36" y="11" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#111111" letter-spacing="0.5">LITERATURE BASIS / 文献来源</text>
      <text x="36" y="28" font-family="'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" fill="#555555">基于 2025 年《Nature Reviews》最新综述文章研讨</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(0, 70)">
      <circle cx="12" cy="12" r="12" fill="none" stroke="#111111" stroke-width="1.5"/>
      <text x="12" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">02</text>
      <text x="36" y="11" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#111111" letter-spacing="0.5">CORE FOCUS / 汇报核心</text>
      <text x="36" y="28" font-family="'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" fill="#555555">总结忆阻器从器件机制到晶圆级（Fab）产业化进展</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(0, 140)">
      <circle cx="12" cy="12" r="12" fill="none" stroke="#111111" stroke-width="1.5"/>
      <text x="12" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">03</text>
      <text x="36" y="11" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#111111" letter-spacing="0.5">REPORT TARGET / 汇报对象</text>
      <text x="36" y="28" font-family="'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" fill="#555555">课题组组会汇报 · 面向导师与研究团队</text>
    </g>
  </g>

  <!-- Footer Metadata -->
  <g transform="translate(70, 645)">
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="11" fill="#888888">STATUS: PREPARATION / TOPIC: MEMRISTOR FABRICATION &amp; COMPUTING</text>
  </g>


  <!-- RIGHT COLUMN: Abstract Line Art Visual Diagram -->
  <!-- Main Diagram Box -->
  <g transform="translate(630, 75)">
    <rect x="0" y="0" width="570" height="570" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <rect x="6" y="6" width="558" height="558" fill="none" stroke="#E5E5E5" stroke-width="1"/>

    <!-- Diagram Header -->
    <path d="M 0 0 L 0 32 L 280 32 L 295 0 Z" fill="#111111"/>
    <text x="15" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">SYSTEM ARCHITECTURE SCHEMATIC</text>

    <!-- SECTION 1: Memristor Crossbar Array (Top Visual) -->
    <g transform="translate(40, 65)">
      <text x="0" y="15" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" letter-spacing="0.5">[ A ] CROSSBAR ARRAY ARCHITECTURE (1T1R / PASSIVE)</text>

      <!-- Wordlines (Horizontal) -->
      <g stroke="#111111" stroke-width="1.5">
        <line x1="60" y1="50" x2="450" y2="50"/>
        <line x1="60" y1="90" x2="450" y2="90"/>
        <line x1="60" y1="130" x2="450" y2="130"/>
        <line x1="60" y1="170" x2="450" y2="170"/>
      </g>
      <!-- Bitlines (Vertical) -->
      <g stroke="#111111" stroke-width="1.5">
        <line x1="120" y1="30" x2="120" y2="190"/>
        <line x1="200" y1="30" x2="200" y2="190"/>
        <line x1="280" y1="30" x2="280" y2="190"/>
        <line x1="360" y1="30" x2="360" y2="190"/>
      </g>

      <!-- Line Labels -->
      <text x="25" y="54" font-family="'Courier New', monospace" font-size="11" fill="#666">WL_0</text>
      <text x="25" y="94" font-family="'Courier New', monospace" font-size="11" fill="#666">WL_1</text>
      <text x="25" y="134" font-family="'Courier New', monospace" font-size="11" fill="#666">WL_2</text>
      <text x="25" y="174" font-family="'Courier New', monospace" font-size="11" fill="#666">WL_3</text>

      <text x="120" y="210" font-family="'Courier New', monospace" font-size="11" fill="#666" text-anchor="middle">BL_0</text>
      <text x="200" y="210" font-family="'Courier New', monospace" font-size="11" fill="#666" text-anchor="middle">BL_1</text>
      <text x="280" y="210" font-family="'Courier New', monospace" font-size="11" fill="#666" text-anchor="middle">BL_2</text>
      <text x="360" y="210" font-family="'Courier New', monospace" font-size="11" fill="#666" text-anchor="middle">BL_3</text>

      <!-- Nodes at Intersections -->
      <use href="#memristor-node" x="120" y="50"/>
      <use href="#memristor-node" x="200" y="50"/>
      <use href="#memristor-node" x="280" y="50"/>
      <use href="#memristor-node" x="360" y="50"/>

      <use href="#memristor-node" x="120" y="90"/>
      <use href="#memristor-node" x="200" y="90"/>
      <use href="#memristor-node" x="280" y="90"/>
      <use href="#memristor-node" x="360" y="90"/>

      <use href="#memristor-node" x="120" y="130"/>
      <use href="#memristor-node" x="200" y="130"/>
      <use href="#memristor-node" x="280" y="130"/>
      <use href="#memristor-node" x="360" y="130"/>

      <use href="#memristor-node" x="120" y="170"/>
      <use href="#memristor-node" x="200" y="170"/>
      <use href="#memristor-node" x="280" y="170"/>
      <use href="#memristor-node" x="360" y="170"/>

      <!-- Highlighting Active Synaptic State -->
      <circle cx="280" cy="90" r="14" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="305" y="80" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#111111">G_ij (Weight)</text>
    </g>

    <!-- SECTION 2 Bottom Left: Pinched Hysteresis Loop (Lab Characterization) -->
    <g transform="translate(40, 320)">
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" letter-spacing="0.5">[ B ] I-V HYSTERESIS (LAB)</text>

      <!-- Axes -->
      <line x1="20" y1="110" x2="200" y2="110" stroke="#111111" stroke-width="1.2"/>
      <line x1="110" y1="20" x2="110" y2="200" stroke="#111111" stroke-width="1.2"/>

      <text x="205" y="114" font-family="'Georgia', serif" font-size="11" font-style="italic">V</text>
      <text x="107" y="12" font-family="'Georgia', serif" font-size="11" font-style="italic">I</text>

      <!-- Pinched Hysteresis Bowtie Path -->
      <path d="M 110 110 
               C 130 60, 180 30, 180 80 
               C 180 110, 140 105, 110 110 
               C 80 115, 40 110, 40 140 
               C 40 190, 90 160, 110 110 Z" 
            fill="none" stroke="#111111" stroke-width="2"/>

      <!-- State Annotations -->
      <text x="145" y="45" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#111111">RON (LRS)</text>
      <text x="45" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#111111">ROFF (HRS)</text>
      <circle cx="110" cy="110" r="3" fill="#111111"/>
      <text x="115" y="123" font-family="'Courier New', monospace" font-size="9" fill="#666">(0,0)</text>
    </g>

    <!-- Transition Arrow: Lab -> Fab -->
    <g transform="translate(255, 410)">
      <line x1="0" y1="10" x2="45" y2="10" stroke="#111111" stroke-width="2"/>
      <polygon points="45,5 55,10 45,15" fill="#111111"/>
      <text x="27" y="-2" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#111111" text-anchor="middle">SCALING</text>
      <text x="27" y="28" font-family="'PingFang SC', sans-serif" font-size="9" fill="#666666" text-anchor="middle">量产化</text>
    </g>

    <!-- SECTION 3 Bottom Right: Wafer Fabrication Motif (Fab Integration) -->
    <g transform="translate(320, 320)">
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111111" letter-spacing="0.5">[ C ] 300mm WAFER (FAB)</text>

      <!-- Wafer Circle Outer Frame -->
      <circle cx="100" cy="110" r="80" fill="none" stroke="#111111" stroke-width="1.5"/>
      <!-- Wafer Flat Notch -->
      <path d="M 85 189 L 115 189" stroke="#111111" stroke-width="2"/>

      <!-- Silicon Die Grid Inside Wafer -->
      <g stroke="#888888" stroke-width="0.75" stroke-dasharray="1 1">
        <!-- Vertical grid lines -->
        <line x1="60" y1="50" x2="60" y2="170"/>
        <line x1="80" y1="35" x2="80" y2="185"/>
        <line x1="100" y1="30" x2="100" y2="188"/>
        <line x1="120" y1="35" x2="120" y2="185"/>
        <line x1="140" y1="50" x2="140" y2="170"/>

        <!-- Horizontal grid lines -->
        <line x1="50" y1="60" x2="150" y2="60"/>
        <line x1="35" y1="80" x2="165" y2="80"/>
        <line x1="30" y1="100" x2="170" y2="100"/>
        <line x1="35" y1="120" x2="165" y2="120"/>
        <line x1="45" y1="140" x2="155" y2="140"/>
        <line x1="60" y1="160" x2="140" y2="160"/>
      </g>

      <!-- Highlighted Commercial Die -->
      <rect x="100" y="100" width="20" height="20" fill="#111111" opacity="0.15" stroke="#111111" stroke-width="1.5"/>
      <text x="100" y="208" font-family="'Courier New', monospace" font-size="9" fill="#111111" text-anchor="middle">CMOS-BEOL INTEGRATION</text>
    </g>

    <!-- Technical Spec Overlay Footer -->
    <g transform="translate(20, 545)">
      <line x1="0" y1="0" x2="530" y2="0" stroke="#E5E5E5" stroke-width="1"/>
      <text x="0" y="15" font-family="'Courier New', monospace" font-size="10" fill="#888888">FIG 1.0: MEMRISTIVE DEVICE TO COMMERCIAL WAFER INTEGRATION PIPELINE</text>
    </g>
  </g>

</svg>
